name: devnet-demo

# Runs the agents against the deployed devnet program with a dedicated demo
# wallet held as an encrypted repository secret (GREENROOM_DEVNET_WALLET).
# With band = mine, the tour is booked as your own band: its wallet (the
# GREENROOM_BAND_WALLET secret, a Phantom base58 export or a Solana CLI JSON
# array) signs the band's transactions, so connecting that wallet on the
# dashboard shows the tour. The demo wallet still pays fees and the fans.
# Nobody needs the key: anyone with write access can start this from the
# Actions tab. The run's summary and transcript are uploaded as an artifact
# and, when "publish" is true, committed to packages/web/public/demo so the
# Pages dashboard shows it.
on:
  workflow_dispatch:
    inputs:
      shows:
        description: "Shows to book"
        default: "8"
      max_venues:
        description: "Venues to register (all = 136; each costs ~0.003 SOL once)"
        default: "60"
      fans:
        description: "Base fans per city (scaled by population)"
        default: "10"
      deadline:
        description: "Seconds from sales opening to each show's threshold deadline (devnet purchases run ~1 per 2 s)"
        default: "240"
      show_after:
        description: "Seconds from sales opening to the show date (settlement)"
        default: "360"
      history:
        description: "Replay a short previous tour first: false, true, or only (just the past tour of 'shows' shows: builds the band's on-chain record and reputation)"
        default: "false"
      publish:
        description: "Commit the run to the dashboard bundle (true/false)"
        default: "true"
      band:
        description: "Whose band books the tour: demo (generated band) or mine (the GREENROOM_BAND_WALLET secret)"
        type: choice
        options: [demo, mine]
        default: demo
      band_profile:
        description: "With band = mine: name|genre|draw|home city"
        default: "The Running Pigeons|indie|400|Berlin"

permissions:
  contents: write
  actions: write

concurrency:
  group: devnet-demo
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Demo wallet from the repository secret
        run: |
          test -n "${{ secrets.GREENROOM_DEVNET_WALLET }}" || { echo "secret GREENROOM_DEVNET_WALLET is not set"; exit 1; }
          mkdir -p ~/.config/solana
          umask 077
          printf '%s' '${{ secrets.GREENROOM_DEVNET_WALLET }}' > ~/.config/solana/demo.json
      - name: Band wallet from the repository secret
        if: ${{ inputs.band == 'mine' }}
        env:
          BAND_WALLET: ${{ secrets.GREENROOM_BAND_WALLET }}
        run: |
          test -n "$BAND_WALLET" || { echo "band = mine needs the GREENROOM_BAND_WALLET secret (your band wallet's private key)"; exit 1; }
          umask 077
          printf '%s' "$BAND_WALLET" > ~/.config/solana/band.key
      - name: Run the agents on devnet
        # bash runs with pipefail: a failed run fails the step instead of hiding behind the log filter
        shell: bash
        env:
          GREENROOM_RPC_URL: ${{ secrets.GREENROOM_RPC_URL || 'https://api.devnet.solana.com' }}
          # the wallet that receives the 10% platform fee of every booked show (the repository variable overrides it)
          GREENROOM_PLATFORM_WALLET: ${{ vars.GREENROOM_PLATFORM_WALLET || 'VWmCwdcsueHfRemR2jKfxCvBTfzzr1R7aQpZrkN112a' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BAND: ${{ inputs.band }}
          BAND_PROFILE: ${{ inputs.band_profile }}
        run: |
          ARGS="--rpc $GREENROOM_RPC_URL --wallet $HOME/.config/solana/demo.json --shows ${{ inputs.shows }} --max-venues ${{ inputs.max_venues }} --fans ${{ inputs.fans }} --deadline ${{ inputs.deadline }} --show ${{ inputs.show_after }}"
          if [ "${{ inputs.history }}" = "true" ]; then ARGS="$ARGS --history"; fi
          if [ "${{ inputs.history }}" = "only" ]; then ARGS="$ARGS --history-only --history-shows ${{ inputs.shows }}"; fi
          BAND_ARGS=()
          if [ "$BAND" = "mine" ]; then
            IFS='|' read -r B_NAME B_GENRE B_DRAW B_HOME <<< "$BAND_PROFILE"
            BAND_ARGS=(--band-keypair "$HOME/.config/solana/band.key" --band-name "$B_NAME" --genre "$B_GENRE" --draw "$B_DRAW" --home-city "$B_HOME")
          fi
          npm run demo -w @greenroom/agents -- $ARGS "${BAND_ARGS[@]}" 2>&1 | tee demo.log | grep -v "^\[fan.bought\]\|^\[venue\.\|429 Too Many"
      - name: Upload the run
        uses: actions/upload-artifact@v4
        with:
          name: devnet-run
          path: |
            data/runs/
            demo.log
      - name: Publish to the dashboard bundle
        if: ${{ inputs.publish == 'true' }}
        run: |
          dir=$(node -e "console.log(require('./data/runs/latest.json').dir)")
          cp "$dir/summary.json" packages/web/public/demo/summary.json
          cp "$dir/transcript.jsonl" packages/web/public/demo/transcript.jsonl
          git config user.name "greenroom-devnet-demo[bot]"
          git config user.email "noreply@github.com"
          git add packages/web/public/demo
          git commit -m "Dashboard bundle: devnet run $(basename "$dir")" || { echo "nothing to publish"; exit 0; }
          # main may have moved during the run; the bundle files are ours alone
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break
            sleep 10
          done
          # Pushes made with the workflow token do not trigger other workflows,
          # so rebuild the Pages site explicitly.
          gh workflow run pages.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Remove the wallet file
        if: always()
        run: rm -f ~/.config/solana/demo.json ~/.config/solana/band.key
