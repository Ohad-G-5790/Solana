name: cloudflare

# Deploys the static dashboard to greenroomtours.com (Cloudflare Workers static
# assets, see wrangler.jsonc) on every push to main, served from the domain root.
# Needs two repository secrets; without them the job reports what is missing
# and stops without failing:
#   CLOUDFLARE_API_TOKEN   an API token with the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  the account id shown on the Workers & Pages overview
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check credentials
        id: creds
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set; greenroomtours.com was not deployed."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.creds.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
        if: steps.creds.outputs.ok == 'true'
      - name: Build static dashboard (domain root)
        if: steps.creds.outputs.ok == 'true'
        run: npm run build:static -w @greenroom/web
        env:
          NEXT_PUBLIC_BASE_PATH: ""
          NEXT_PUBLIC_RPC_URL: ${{ vars.GREENROOM_PUBLIC_RPC_URL || 'https://api.devnet.solana.com' }}
          NEXT_PUBLIC_CLUSTER: devnet
          NEXT_PUBLIC_SIGNUP_URL: ${{ vars.GREENROOM_SIGNUP_URL || 'https://script.google.com/macros/s/AKfycbzA2vwWOATCPKEMqpTcOjjEcKwOm6aiWfSRMFGj7r7VIoSqpueM6YbcHJ_hPVHnkFlF/exec' }}
          NEXT_PUBLIC_PLATFORM_WALLET: ${{ vars.GREENROOM_PLATFORM_WALLET || 'VWmCwdcsueHfRemR2jKfxCvBTfzzr1R7aQpZrkN112a' }}
          NEXT_PUBLIC_PROGRAM_ID: 4KSaYomRjbnijK1yAELZEGFMPsoPE6u7unY2T6mASUT8
      - name: Deploy to Cloudflare
        if: steps.creds.outputs.ok == 'true'
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
